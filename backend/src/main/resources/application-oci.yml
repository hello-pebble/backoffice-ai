spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:5}
      minimum-idle: ${SUPABASE_DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000

server:
  address: 0.0.0.0
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

office:
  # 배포 기본값은 로그인 필수. allowed-emails 가 비면 아무도 들어올 수 없다.
  #
  # 프런트(Vercel)가 /api/* 를 Railway 로 rewrite 하므로 브라우저에는 vercel.app 한 도메인만 보인다.
  # 따라서 쿠키는 교차 도메인이 아니라 SameSite=Lax 로 충분하다(None 보다 안전).
  # 다만 리디렉션 주소는 반드시 Vercel 도메인이어야 한다. Railway 주소로 잡으면 쿠키가
  # railway.app 에 저장되고, 이후 요청은 vercel.app 으로 가서 쿠키가 실리지 않아 로그인이 계속 풀린다.
  auth:
    enabled: ${OFFICE_AUTH_ENABLED:true}
    allowed-emails: ${OFFICE_AUTH_ALLOWED_EMAILS:}
    session-hours: ${OFFICE_AUTH_SESSION_HOURS:24}
    redirect-uri: ${OFFICE_AUTH_REDIRECT_URI:https://backoffice-ai-orpin.vercel.app/api/auth/callback}
    success-redirect: ${OFFICE_AUTH_SUCCESS_REDIRECT:https://backoffice-ai-orpin.vercel.app/}
    cookie-secure: ${OFFICE_AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${OFFICE_AUTH_COOKIE_SAME_SITE:Lax}
  slack:
    client-id: ${OFFICE_SLACK_CLIENT_ID:}
    client-secret: ${OFFICE_SLACK_CLIENT_SECRET:}
    redirect-uri: ${OFFICE_SLACK_REDIRECT_URI:https://backoffice-ai-orpin.vercel.app/api/slack/callback}
    review-base-url: ${OFFICE_SLACK_REVIEW_BASE_URL:https://backoffice-ai-orpin.vercel.app}
  automation:
    execution-enabled: ${OFFICE_AUTOMATION_EXECUTION_ENABLED:true}
    worker-url: ${OFFICE_AUTOMATION_WORKER_URL:}
    worker-api-key: ${OFFICE_AUTOMATION_WORKER_API_KEY:}
  gmail:
    enabled: ${OFFICE_GMAIL_ENABLED:false}
    credentials-json: ${OFFICE_GMAIL_CREDENTIALS_JSON:}
  toss:
    enabled: ${OFFICE_TOSS_ENABLED:false}
    base-url: ${OFFICE_TOSS_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${OFFICE_TOSS_CLIENT_ID:}
    client-secret: ${OFFICE_TOSS_CLIENT_SECRET:}



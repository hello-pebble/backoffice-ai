spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:5}
      minimum-idle: ${SUPABASE_DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000

server:
  address: 0.0.0.0
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

office:
  # 배포 기본값은 로그인 필수. 프런트(Vercel)와 도메인이 달라 쿠키는 SameSite=None; Secure 여야 한다.
  auth:
    enabled: ${OFFICE_AUTH_ENABLED:true}
    allowed-emails: ${OFFICE_AUTH_ALLOWED_EMAILS:}
    redirect-uri: ${OFFICE_AUTH_REDIRECT_URI:}
    success-redirect: ${OFFICE_AUTH_SUCCESS_REDIRECT:}
    cookie-secure: ${OFFICE_AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${OFFICE_AUTH_COOKIE_SAME_SITE:None}
  slack:
    client-id: ${OFFICE_SLACK_CLIENT_ID:}
    client-secret: ${OFFICE_SLACK_CLIENT_SECRET:}
    redirect-uri: ${OFFICE_SLACK_REDIRECT_URI:}
    review-base-url: ${OFFICE_SLACK_REVIEW_BASE_URL:}
  automation:
    execution-enabled: ${OFFICE_AUTOMATION_EXECUTION_ENABLED:true}
    worker-url: ${OFFICE_AUTOMATION_WORKER_URL:}
    worker-api-key: ${OFFICE_AUTOMATION_WORKER_API_KEY:}
  gmail:
    enabled: ${OFFICE_GMAIL_ENABLED:false}
    # 배포 프로파일의 기본값은 배포 도메인이어야 한다. localhost로 두면 환경변수 누락 시
    # 조용히 localhost로 리다이렉트돼 인증이 끝나지 않는다.
    redirect-uri: ${OFFICE_GMAIL_REDIRECT_URI:https://backoffice-ai-production.up.railway.app/api/gmail/callback}
    credentials-json: ${OFFICE_GMAIL_CREDENTIALS_JSON:}
  toss:
    enabled: ${OFFICE_TOSS_ENABLED:false}
    base-url: ${OFFICE_TOSS_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${OFFICE_TOSS_CLIENT_ID:}
    client-secret: ${OFFICE_TOSS_CLIENT_SECRET:}



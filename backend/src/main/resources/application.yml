spring:
  application:
    name: office-dashboard
  config:
    import: optional:file:config/dashboard.properties
  web:
    resources:
      static-locations: file:frontend/static/
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/backoffice}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8765}

app:
  auth:
    enabled: ${APP_AUTH_ENABLED:false}
    api-key: ${APP_AUTH_API_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

office:
  gmail:
    enabled: ${OFFICE_GMAIL_ENABLED:false}
    redirect-uri: ${OFFICE_GMAIL_REDIRECT_URI:http://127.0.0.1:8765/api/gmail/callback}
    credentials-json: ${OFFICE_GMAIL_CREDENTIALS_JSON:}
  toss:
    enabled: ${OFFICE_TOSS_ENABLED:false}
    base-url: ${OFFICE_TOSS_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${OFFICE_TOSS_CLIENT_ID:}
    client-secret: ${OFFICE_TOSS_CLIENT_SECRET:}

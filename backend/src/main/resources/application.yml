spring:
  application:
    name: office-dashboard
  config:
    import: optional:file:config/dashboard.properties
  web:
    resources:
      static-locations: file:frontend/static/
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/backoffice}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8765}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

office:
  automation:
    execution-enabled: ${OFFICE_AUTOMATION_EXECUTION_ENABLED:true}
    worker-url: ${OFFICE_AUTOMATION_WORKER_URL:}
    worker-api-key: ${OFFICE_AUTOMATION_WORKER_API_KEY:}
  gmail:
    enabled: ${OFFICE_GMAIL_ENABLED:false}
    credentials-json: ${OFFICE_GMAIL_CREDENTIALS_JSON:}
  auth:
    enabled: ${OFFICE_AUTH_ENABLED:false}
    allowed-emails: ${OFFICE_AUTH_ALLOWED_EMAILS:}
    session-hours: ${OFFICE_AUTH_SESSION_HOURS:24}
    redirect-uri: ${OFFICE_AUTH_REDIRECT_URI:http://127.0.0.1:8765/api/auth/callback}
    success-redirect: ${OFFICE_AUTH_SUCCESS_REDIRECT:http://127.0.0.1:8765/}
    cookie-secure: ${OFFICE_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${OFFICE_AUTH_COOKIE_SAME_SITE:Lax}
  slack:
    client-id: ${OFFICE_SLACK_CLIENT_ID:}
    client-secret: ${OFFICE_SLACK_CLIENT_SECRET:}
    redirect-uri: ${OFFICE_SLACK_REDIRECT_URI:http://127.0.0.1:8765/api/slack/callback}
    review-base-url: ${OFFICE_SLACK_REVIEW_BASE_URL:http://127.0.0.1:8765}
  llm:
    image-api-key: ${OFFICE_LLM_IMAGE_API_KEY:}
    image-model: ${OFFICE_LLM_IMAGE_MODEL:imagen-4.0-fast-generate-001}
    image-price-usd: ${OFFICE_LLM_IMAGE_PRICE_USD:0.02}
    image-daily-limit: ${OFFICE_LLM_IMAGE_DAILY_LIMIT:30}
    image-stale-minutes: ${OFFICE_LLM_IMAGE_STALE_MINUTES:10}
  demo:
    enabled: ${OFFICE_DEMO_ENABLED:false}
    session-hours: ${OFFICE_DEMO_SESSION_HOURS:2}
    llm-daily-limit: ${OFFICE_DEMO_LLM_DAILY_LIMIT:30}
    llm-session-limit: ${OFFICE_DEMO_LLM_SESSION_LIMIT:5}
    image-daily-limit: ${OFFICE_DEMO_IMAGE_DAILY_LIMIT:8}
    image-session-limit: ${OFFICE_DEMO_IMAGE_SESSION_LIMIT:4}
  toss:
    enabled: ${OFFICE_TOSS_ENABLED:false}
    base-url: ${OFFICE_TOSS_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${OFFICE_TOSS_CLIENT_ID:}
    client-secret: ${OFFICE_TOSS_CLIENT_SECRET:}



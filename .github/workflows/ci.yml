name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build backend (compile + test)
        run: |
          chmod +x gradlew
          ./gradlew :backend:build --no-daemon

  automation:
    name: automation-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q automation

      # 문법 검사만으로는 ImportError를 잡지 못한다. 실제 import 그래프를 한 번 실행한다.
      - name: Check imports
        run: |
          pip install -r automation/requirements.txt
          python -c "import automation.main"

  frontend:
    name: frontend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend syntax
        run: node --check frontend/static/app.js
